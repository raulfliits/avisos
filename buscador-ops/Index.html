<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rojo: #D60505; --rojo-osc: #A80404; --rojo-suave: #FBE3E3;
    --negro: #0A0A0A; --crema: #F2F1EC; --gris: #6B6B6B; --linea: #E2E0D8; --blanco: #FFFFFF;
    --spec: #E4F1E4; --spec-t: #1F5F2A; --man: #FBE3E3; --man-t: #A80404;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; background: var(--crema); color: var(--negro); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .marca { background: var(--negro); color: #fff; padding: 14px 16px; font-family: Unbounded, "Arial Black", sans-serif; font-weight: 800; font-size: 20px; }
  .marca span { color: var(--rojo); }
  .marca small { font-size: 11px; font-weight: 500; opacity: .7; margin-left: 6px; letter-spacing: .12em; }
  header.busca { background: var(--crema); border-bottom: 1px solid var(--linea); padding: 22px 16px 14px; position: sticky; top: 0; z-index: 2; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-family: Unbounded, "Arial Black", sans-serif; font-weight: 800; font-size: 22px; margin: 0 0 6px; }
  .sub { color: var(--gris); font-size: 15px; line-height: 1.5; margin: 0 0 16px; }
  .search { display: flex; gap: 8px; }
  input[type=search] { flex: 1; min-width: 0; font: 500 16px Inter, system-ui, sans-serif; padding: 14px 20px; border: 2px solid var(--negro); border-radius: 999px; background: var(--blanco); color: var(--negro); outline: none; }
  input[type=search]::placeholder { color: #9a9890; }
  input[type=search]:focus { border-color: var(--rojo); box-shadow: 0 0 0 4px var(--rojo-suave); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { border: 1px solid var(--linea); background: var(--blanco); border-radius: 999px; padding: 7px 14px; font: 500 13px Inter, system-ui, sans-serif; cursor: pointer; color: var(--negro); }
  .chip:hover { border-color: var(--negro); }
  .chip.on { background: var(--negro); border-color: var(--negro); color: #fff; }
  #roles .chip.on { background: var(--rojo); border-color: var(--rojo); }
  main { padding: 16px 16px 48px; }
  .meta { color: var(--gris); font-size: 13px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .meta button { background: var(--negro); color: #fff; border: none; border-radius: 999px; padding: 7px 14px; cursor: pointer; font: 600 11px Inter, system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  .meta button:active { background: var(--rojo); }
  .card { background: var(--blanco); border: 1px solid var(--linea); border-left: 4px solid var(--rojo); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .card a.title { font-weight: 600; font-size: 16px; color: var(--negro); text-decoration: none; word-break: break-word; }
  .card a.title::after { content: " ↗"; color: var(--rojo); font-weight: 600; }
  .card a.title:hover { color: var(--rojo); }
  .desc { margin: 6px 0 10px; font-size: 14px; line-height: 1.5; color: #2a2a2a; }
  .desc.empty { color: var(--gris); font-style: italic; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  .tag { padding: 3px 9px; border-radius: 999px; background: var(--crema); color: var(--gris); font-weight: 500; }
  .tag.spec { background: var(--spec); color: var(--spec-t); }
  .tag.man { background: var(--man); color: var(--man-t); }
  .group h2 { font-family: Unbounded, "Arial Black", sans-serif; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--negro); margin: 22px 0 10px; }
  .empty-state { text-align: center; color: var(--gris); padding: 40px 10px; line-height: 1.5; }
  .carga { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 48px 0; color: var(--gris); font-size: 14px; }
  .puntos { display: flex; gap: 8px; }
  .puntos i { width: 8px; height: 8px; border-radius: 50%; background: var(--rojo); opacity: .25; animation: p 1s infinite ease-in-out; }
  .puntos i:nth-child(2) { animation-delay: .15s; }
  .puntos i:nth-child(3) { animation-delay: .3s; }
  @keyframes p { 0%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .puntos i { animation: none; opacity: .6; } }
  @media (max-width: 600px) {
    header.busca { position: static; }
    #cats { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    #cats .chip { flex: none; }
  }
  .marca { display: flex; align-items: baseline; }
  .marca em { margin-left: auto; font: 600 10px Inter, system-ui, sans-serif; letter-spacing: .12em; font-style: normal; color: #fff; opacity: .75; }
  .card.manager { border-left-color: var(--negro); background: var(--rojo-suave); border-color: #F3C9C9; }
  .card.manager .titulo-aviso { margin: 0; font-family: Unbounded, "Arial Black", sans-serif; font-weight: 700; font-size: 15px; color: var(--rojo-osc); }
  .card.manager .tag { background: var(--blanco); }
  .sin-acceso { max-width: 440px; margin: 40px auto; text-align: center; }
  .sin-acceso h1 { margin-bottom: 10px; }
  .sin-acceso p { color: var(--gris); line-height: 1.5; }
  .feedback { margin-top: 18px; background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px; padding: 14px 16px; }
  .fb-pregunta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; font-size: 14px; }
  .fb-pregunta span { margin-right: 4px; }
  .fb-btn, .fb-enviar { border: 2px solid var(--negro); background: var(--blanco); color: var(--negro); border-radius: 999px; padding: 7px 18px; font: 600 13px Inter, system-ui, sans-serif; cursor: pointer; }
  .fb-btn:hover { background: var(--negro); color: #fff; }
  .fb-enviar { background: var(--rojo); border-color: var(--rojo); color: #fff; margin-top: 8px; }
  .fb-enviar:disabled { opacity: .5; cursor: default; }
  .fb-no { margin-top: 12px; }
  .fb-no label { display: block; font-size: 13px; color: var(--gris); margin-bottom: 6px; }
  .fb-no textarea { width: 100%; font: 14px Inter, system-ui, sans-serif; padding: 10px 12px; border: 1px solid var(--linea); border-radius: 12px; resize: vertical; outline: none; }
  .fb-no textarea:focus { border-color: var(--rojo); box-shadow: 0 0 0 3px var(--rojo-suave); }
  .fb-gracias { margin: 0; font-size: 14px; color: var(--spec-t); font-weight: 600; }
  mark { background: var(--rojo-suave); color: var(--rojo-osc); padding: 0 2px; border-radius: 3px; }
</style>
</head>
<body>
<div class="marca">FL<span>ii</span>TS<small>BUSCADOR OPS</small><em id="rol-usuario"></em></div>
<header class="busca">
  <div class="wrap">
    <h1>¿Qué necesitas gestionar?</h1>
    <p class="sub">Escríbelo como lo preguntarías y te enseño los archivos y herramientas que te sirven, con para qué es cada uno.</p>
    <div class="search">
      <input id="q" type="search" placeholder="Ej.: entregar una chaqueta, ver vacaciones, cambio de vehículo…" autocomplete="off" autofocus>
    </div>
    <div class="filters" id="roles"></div>
    <div class="filters" id="cats"></div>
  </div>
</header>
<main>
  <div class="wrap">
    <p class="meta"><span id="count">Cargando…</span><button id="refresh" type="button">Actualizar</button></p>
    <div id="results"><div class="carga"><div class="puntos" aria-hidden="true"><i></i><i></i><i></i></div>Cargando el catálogo…</div></div>
    <div id="feedback" class="feedback" hidden>
      <div class="fb-pregunta">
        <span>¿Te ha resultado útil?</span>
        <button type="button" class="fb-btn" data-util="1">Sí</button>
        <button type="button" class="fb-btn" data-util="0">No</button>
      </div>
      <div class="fb-no" hidden>
        <label for="fb-texto">¿Qué buscabas o por qué no te sirve? Lo usamos para mejorar el buscador.</label>
        <textarea id="fb-texto" rows="3" maxlength="1000" placeholder="Ej.: buscaba cómo pedir una moto de sustitución y no sale nada"></textarea>
        <button type="button" class="fb-enviar">Enviar</button>
      </div>
      <p class="fb-gracias" hidden></p>
    </div>
  </div>
</main>

<script>
  let ITEMS = [];
  let rol = 'Todos';
  let cat = 'Todas';
  let USUARIO = null;
  let ULTIMA = { q: '', resultados: [] };
  let fbTimer;

  const STOP = new Set('a al como cómo con de del donde dónde el en es esta este hay la las lo los me mi para por que qué se si sobre su un una uno y o tengo quiero necesito puedo hacer hago saber ver busco algo cual cuál cuando cuándo'.split(' ').map(n));
  // Palabras que aparecen en casi todo: cuentan poco.
  const WEAK = new Set(['rider', 'riders', 'fliits', 'courier', 'couriers', 'repartidor', 'repartidores']);
  // Sinónimos: cualquier palabra de un grupo encuentra también las demás.
  const SYN = [
    ['chaqueta', 'chaquetas', 'epi', 'epis', 'ppi', 'ppis', 'uniforme', 'ropa', 'material', 'equipacion'],
    ['mochila', 'mochilas', 'caja', 'bolsa'],
    ['vacaciones', 'ausencias', 'dias libres', 'libranza', 'festivos'],
    ['rider', 'riders', 'courier', 'couriers', 'repartidor', 'repartidores', 'trabajador', 'empleado'],
    ['moto', 'motos', 'vehiculo', 'vehiculos', 'bici', 'coche', 'zoomo'],
    ['kpi', 'kpis', 'metricas', 'indicadores', 'rendimiento', 'dashboard', 'informe', 'report'],
    ['forecast', 'prevision', 'planificacion', 'horas', 'turnos', 'scheduling'],
    ['onboarding', 'alta', 'altas', 'formacion', 'formaciones', 'incorporacion', 'nuevo'],
    ['incentivo', 'incentivos', 'bonus', 'pago', 'pagos', 'plus', 'ajuste', 'ajustes', 'nomina'],
    ['despido', 'despidos', 'despedir', 'despedido', 'echar', 'baja', 'bajas', 'sancion', 'sancionar', 'suspension', 'disciplinario', 'carta'],
    ['comunicacion', 'comunicaciones', 'aviso', 'avisos', 'sms', 'email', 'mail', 'envio', 'masivo', 'mensaje'],
    ['stock', 'inventario', 'almacen'],
    ['cita', 'citas', 'reunion', 'reuniones', 'calendario', 'agenda'],
    ['oficina', 'oficinas', 'atencion', 'rto', 'ticket', 'tickets', 'chat', 'chats'],
    ['uber', 'ubereats'], ['glovo'], ['burger', 'bk', 'burgerking'],
    ['fraude', 'fraud', 'incidencia', 'incidencias'],
    ['fichar', 'fichaje', 'sesame', 'horario'],
    ['referido', 'referidos', 'captacion', 'reclutamiento', 'contratar', 'jobtoday'],
    ['convenio', 'contrato', 'jornada', 'sindical', 'sindicales'],
  ].map(g => g.map(n));

  function n(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function expand(term) {
    const out = new Set([term]);
    SYN.forEach(g => { if (g.some(w => w === term || (term.length > 3 && w.startsWith(term)))) g.forEach(w => out.add(w)); });
    return Array.from(out);
  }

  function score(item, terms) {
    if (!terms.length) return 1;
    const f = item._f;
    let total = 0, hit = 0, fuerte = 0;
    const hayFuertes = terms.some(t => !WEAK.has(t));
    terms.forEach(t => {
      let best = 0;
      const cands = expand(t);
      if (t.length >= 6) cands.push(t.slice(0, t.length - 2));
      cands.forEach(w => {
        const exact = w === t;
        if (!exact && w.length < 4) return;
        const k = exact ? 1 : 0.6;
        if (f.nombre.includes(w)) best = Math.max(best, 5 * k);
        if (f.kw.includes(w)) best = Math.max(best, 4 * k);
        if (f.cat.includes(w)) best = Math.max(best, 3 * k);
        if (f.desc.includes(w)) best = Math.max(best, 2 * k);
      });
      const w = WEAK.has(t) ? 0.25 : 1;
      if (best) hit += w;
      if (best && w === 1) fuerte++;
      total += best * w;
    });
    if (!hit) return 0;
    // Si la búsqueda tiene palabras con contenido, al menos una tiene que coincidir.
    if (hayFuertes && !fuerte) return 0;
    const peso = terms.reduce((a, t) => a + (WEAK.has(t) ? 0.25 : 1), 0);
    return total * (hit / peso);
  }

  function render() {
    const raw = document.getElementById('q').value;
    const terms = n(raw).split(/[^a-z0-9ñ]+/).filter(t => t.length > 1 && !STOP.has(t));
    let list = ITEMS
      .filter(i => rol === 'Todos' || i.roles.indexOf(rol) !== -1)
      .filter(i => cat === 'Todas' || i.categoria === cat)
      .map(i => ({ i, s: score(i, terms) }))
      .filter(x => x.s > 0);
    // Quita resultados muy por debajo del mejor para no listar medio catálogo.
    if (terms.length && list.length) {
      const top = Math.max.apply(null, list.map(x => x.s));
      list = list.filter(x => x.s >= top * 0.35);
    }

    // Lo que no puede ver este usuario: sin búsqueda no se enseña; con búsqueda se agrupa
    // en un único aviso de "consulta con tu manager".
    const bloqueados = list.filter(x => x.i.restringido);
    list = list.filter(x => !x.i.restringido);
    const topVisible = list.length ? Math.max.apply(null, list.map(x => x.s)) : 0;
    const topBloq = bloqueados.length ? Math.max.apply(null, bloqueados.map(x => x.s)) : 0;
    const aviso = terms.length && bloqueados.length ? `
      <div class="card manager">
        <p class="titulo-aviso">Esto lo gestiona tu Ops Manager</p>
        <p class="desc">Para ${bloqueados.length === 1 ? 'esta consulta hay un recurso' : 'esta consulta hay ' + bloqueados.length + ' recursos'} que solo puede usar un Ops Manager. <b>Consulta con tu manager</b> y él o ella te ayudará a gestionarlo.</p>
        <div class="tags">${Array.from(new Set(bloqueados.map(x => x.i.categoria).filter(Boolean))).map(c => `<span class="tag">${esc(c)}</span>`).join('')}</div>
      </div>` : '';

    prepararFeedback(raw.trim(), terms.length ? list.slice().sort((a, b) => b.s - a.s).map(x => x.i.nombre).concat(bloqueados.length ? ['[Aviso: consultar manager]'] : []) : null);

    const box = document.getElementById('results');
    const visibles = ITEMS.filter(i => !i.restringido).length;
    document.getElementById('count').textContent = terms.length
      ? list.length + (list.length === 1 ? ' resultado' : ' resultados')
      : visibles + ' archivos y herramientas';

    if (!list.length && aviso) { box.innerHTML = aviso; return; }
    if (!list.length) {
      box.innerHTML = '<div class="empty-state">No encuentro nada para esa búsqueda. Prueba con otras palabras (por ejemplo "chaqueta", "vacaciones", "incentivos") o pregunta a tu Ops Manager.</div>';
      return;
    }

    const hl = s => {
      let out = esc(s);
      if (!terms.length) return out;
      const words = Array.from(new Set(terms.flatMap(expand))).filter(w => w.length > 2).sort((a, b) => b.length - a.length);
      words.forEach(w => {
        const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        out = out.replace(/(^|>)([^<]+)/g, (m, p, txt) => p + txt.replace(re, '<mark>$1</mark>'));
      });
      return out;
    };

    const card = ({ i }) => `
      <div class="card">
        <a class="title" href="${esc(i.enlace)}" target="_blank" rel="noopener">${hl(i.nombre)}</a>
        <p class="desc ${i.descripcion ? '' : 'empty'}">${i.descripcion ? hl(i.descripcion) : 'Sin descripción todavía. Añádela en el índice de la carpeta.'}</p>
        <div class="tags">
          ${i.roles.map(r => `<span class="tag ${r === 'Ops Specialist' ? 'spec' : 'man'}">${esc(r)}</span>`).join('')}
          ${i.tipo ? `<span class="tag">${esc(i.tipo)}</span>` : ''}
          ${i.categoria ? `<span class="tag">${esc(i.categoria)}</span>` : ''}
        </div>
      </div>`;

    if (terms.length) {
      list.sort((a, b) => b.s - a.s);
      const html = list.map(card).join('');
      box.innerHTML = topBloq > topVisible ? aviso + html : html + aviso;
    } else {
      const groups = {};
      list.forEach(x => (groups[x.i.categoria || 'Sin categoría'] = groups[x.i.categoria || 'Sin categoría'] || []).push(x));
      box.innerHTML = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'es')).map(g =>
        `<section class="group"><h2>${esc(g)}</h2>${groups[g].sort((a, b) => a.i.nombre.localeCompare(b.i.nombre, 'es')).map(card).join('')}</section>`
      ).join('');
    }
  }

  // Enseña "¿Te ha resultado útil?" cuando la persona deja de escribir.
  function prepararFeedback(q, resultados) {
    const fb = document.getElementById('feedback');
    clearTimeout(fbTimer);
    if (!resultados || !q) { fb.hidden = true; return; }
    if (q === ULTIMA.q && !fb.hidden) return;
    fb.hidden = true;
    fbTimer = setTimeout(() => {
      ULTIMA = { q: q, resultados: resultados.slice(0, 10) };
      fb.querySelector('.fb-pregunta').hidden = false;
      fb.querySelector('.fb-no').hidden = true;
      fb.querySelector('.fb-gracias').hidden = true;
      document.getElementById('fb-texto').value = '';
      fb.hidden = false;
    }, 1200);
  }

  function enviarFeedback(util, comentario) {
    const fb = document.getElementById('feedback');
    const gracias = fb.querySelector('.fb-gracias');
    fb.querySelector('.fb-pregunta').hidden = true;
    fb.querySelector('.fb-no').hidden = true;
    gracias.hidden = false;
    gracias.textContent = util ? '¡Gracias! Nos alegra que te haya servido.' : '¡Gracias! Lo revisaremos para que la próxima vez salga lo que necesitas.';
    google.script.run.withFailureHandler(() => { gracias.textContent = 'No se pudo enviar. Inténtalo de nuevo más tarde.'; })
      .enviarFeedback({ busqueda: ULTIMA.q, util: util, comentario: comentario || '', resultados: ULTIMA.resultados });
  }

  document.querySelectorAll('.fb-btn').forEach(b => b.onclick = () => {
    if (b.dataset.util === '1') return enviarFeedback(true, '');
    document.querySelector('#feedback .fb-pregunta').hidden = true;
    document.querySelector('#feedback .fb-no').hidden = false;
    document.getElementById('fb-texto').focus();
  });
  document.querySelector('.fb-enviar').onclick = () => enviarFeedback(false, document.getElementById('fb-texto').value.trim());

  function chips(id, values, current, onPick) {
    const el = document.getElementById(id);
    el.innerHTML = values.map(v => `<button type="button" class="chip ${v === current ? 'on' : ''}" data-v="${esc(v)}">${esc(v)}</button>`).join('');
    el.querySelectorAll('.chip').forEach(b => b.onclick = () => onPick(b.dataset.v));
  }

  function drawFilters() {
    if (USUARIO && USUARIO.rol === 'Ops Manager') {
      chips('roles', ['Todos', 'Ops Specialist', 'Ops Manager'], rol, v => { rol = v; drawFilters(); render(); });
    } else {
      document.getElementById('roles').innerHTML = '';
    }
    const cats = Array.from(new Set(ITEMS.filter(i => !i.restringido).map(i => i.categoria).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'es'));
    chips('cats', ['Todas'].concat(cats), cat, v => { cat = v; drawFilters(); render(); });
  }

  function load(data) {
    if (data.sinAcceso) {
      document.querySelector('header.busca').style.display = 'none';
      document.getElementById('count').textContent = '';
      document.getElementById('refresh').style.display = 'none';
      document.getElementById('results').innerHTML = `<div class="sin-acceso"><h1>Todavía no tienes acceso</h1>
        <p>Tu cuenta${data.email ? ' <b>' + esc(data.email) + '</b>' : ''} no está dada de alta en el buscador. Pide a tu Ops Manager que te añada.</p></div>`;
      try { window.top.postMessage({ fliitsBuscador: 1, tipo: 'listo', titulo: 'Buscador Ops · FLiiTS' }, '*'); } catch (e) {}
      return;
    }
    USUARIO = data.usuario || null;
    if (USUARIO && USUARIO.rol) document.getElementById('rol-usuario').textContent = USUARIO.rol.toUpperCase();
    ITEMS = (data.items || []).map(i => Object.assign(i, {
      _f: { nombre: n(i.nombre), kw: n(i.keywords), cat: n(i.categoria), desc: n(i.descripcion) },
    }));
    drawFilters();
    render();
    try { window.top.postMessage({ fliitsBuscador: 1, tipo: 'listo', titulo: 'Buscador Ops · FLiiTS' }, '*'); } catch (e) {}
  }

  function fail(err) {
    document.getElementById('count').textContent = 'No se pudo cargar el catálogo: ' + (err && err.message ? err.message : err);
  }

  let t;
  document.getElementById('q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 120); });
  document.getElementById('refresh').onclick = () => {
    document.getElementById('count').textContent = 'Actualizando…';
    google.script.run.withSuccessHandler(load).withFailureHandler(fail).refrescarCatalogo();
  };
  google.script.run.withSuccessHandler(load).withFailureHandler(fail).getCatalogo();
</script>
</body>
</html>
